name: stekkies-autoapply

on:
  schedule:
    # GitHub heavily throttles high-frequency schedules on public repos (observed:
    # 5-12 actual runs/day from a */5 cron, with 1-3 hour gaps). So instead of one
    # orchestrator pass per run, each job LOOPS the orchestrator every 5 minutes
    # for ~50 minutes. The cron fires every 30 min, 07:00-21:00 Amsterdam (CEST =
    # UTC+2); with the concurrency queue this gives near-continuous 5-min polling
    # even when GitHub delivers only a fraction of the scheduled events.
    # Shift to 6-20 UTC in winter (CET) if desired.
    - cron: '*/30 5-19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without submitting (dry run)'
        type: boolean
        default: false

concurrency:
  group: stekkies-apply
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Write profile from secret
        run: printf '%s' "$PROFILE_JSON" > profile.json
        env:
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
      - name: Run orchestrator (5-min loop)
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name "stekkies-bot"
          git config user.email "stekkies-bot@users.noreply.github.com"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "DRY-RUN mode (single pass)"
            npx tsx src/orchestrate.ts --limit=3
            exit 0
          fi
          # Loop for ~50 minutes; persist dedupe state after every iteration so
          # an overlapping/queued run always sees fresh state.
          END=$((SECONDS + 3000))
          while true; do
            echo "── orchestrator pass at $(date -u +%H:%M:%SZ) ──"
            npx tsx src/orchestrate.ts --live --limit=8 || echo "pass failed (continuing loop)"
            git add seen.json || true
            if ! git diff --staged --quiet; then
              git commit -m "chore: update dedupe state [skip ci]"
              git pull --rebase --autostash origin main && git push || echo "state push failed this iteration (will retry next)"
            fi
            [ $SECONDS -ge $END ] && break
            sleep 300
          done
      - name: Persist dedupe state (backstop)
        if: always()
        run: |
          git config user.name "stekkies-bot"
          git config user.email "stekkies-bot@users.noreply.github.com"
          git add seen.json || true
          if git diff --staged --quiet; then echo "no state change"; exit 0; fi
          git commit -m "chore: update dedupe state [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then echo "state pushed"; exit 0; fi
            echo "push retry $i"; sleep 3
          done
          echo "WARNING: could not persist state this run"; exit 0
      - name: Upload run evidence (results log + proof screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-evidence-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 14
